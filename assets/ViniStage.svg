<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Same red endpoints as Editor::paint, with a subtle hardware-panel grain. -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd252a"/>
      <stop offset="1" stop-color="#79070e"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="42" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="shape"><rect x="64" y="64" width="896" height="896" rx="194"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect x="64" y="64" width="896" height="896" fill="url(#panel)"/>
    <rect x="64" y="64" width="896" height="896" filter="url(#grain)" opacity="0.075" style="mix-blend-mode:soft-light"/>
  </g>
  <text x="520" y="696" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="520" font-weight="700" letter-spacing="-18" fill="#ffffff">VS</text>
</svg>
